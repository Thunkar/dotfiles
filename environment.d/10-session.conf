# Session-wide environment — the ONLY place env vars live in this repo.
#
# Read by `systemd --user` at login (and on `systemctl --user daemon-reload`),
# so it reaches every process in the session: Hyprland itself (uwsm runs it as
# a systemd unit), everything Hyprland spawns, D-Bus-activated services,
# portals and user units. Hyprland's own hl.env() would only reach Hyprland's
# children, which is why nothing is set there. Changes need a re-login.

# Cursor
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
HYPRCURSOR_SIZE=24

# Shell / terminal. $TERMINAL is read by xdg-open, wofi and "Terminal=true"
# .desktop launchers (btop, lazygit, …); SHELL pins zsh for anything that
# inherits it from the session instead of the login shell.
SHELL=/usr/bin/zsh
TERMINAL=kitty

# Wayland-native toolkits.
QT_QPA_PLATFORM=wayland
# qt6ct/qt5ct: style=Fusion + the palette rendered from theme/colors.env.
# Deliberately nothing fancier (no Kvantum/KColorScheme) — it wouldn't fix
# KDE Frameworks apps anyway; use the GTK equivalents.
QT_QPA_PLATFORMTHEME=qt6ct
GTK_THEME=adw-gtk3-dark
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=wayland
NIXOS_OZONE_WL=1
