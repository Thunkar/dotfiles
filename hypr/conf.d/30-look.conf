# Borders, gaps, decoration, animations, layouts.
# Colors come from theme/colors.conf (sourced in hyprland.conf).

general {
    gaps_in  = 6
    gaps_out = 14

    border_size = 2
    col.active_border   = $accent $accent_alt 45deg
    col.inactive_border = $surface1

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2

    active_opacity   = 0.97
    inactive_opacity = 0.88

    shadow {
        enabled      = true
        range        = 18
        render_power = 3
        color        = rgba(11111baa)
        offset       = 0 4
    }

    blur {
        enabled       = true
        size          = 8
        passes        = 3
        new_optimizations = true
        ignore_opacity = true
        xray          = false
        vibrancy      = 0.18
    }
}

animations {
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor,    1, 7,    quick
}

dwindle {
    # `pseudotile` was removed in Hyprland 0.55. The pseudo-tiling
    # behaviour is still available via the `pseudo` dispatcher
    # (bound to SUPER+P in 60-keybinds.conf).
    preserve_split  = true
    smart_split     = false
    smart_resizing  = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    # `vfr` was removed in Hyprland 0.55 — render-on-demand is now the
    # default behaviour with no toggle.
    # vrr = 0 (off). Mixed refresh-rate setups (e.g. 240Hz + 60Hz)
    # flicker badly with global VRR on. If your outputs all support
    # adaptive sync, set this to 2 (fullscreen-only) for less risk.
    vrr                     = 0
    # When set to true, Hyprland honours xdg-activation requests by
    # jumping to the window's workspace. Chat apps (Telegram,
    # Discord, Slack) fire this on every notification, which yanks
    # you out of whatever you were doing. Off = stay put; the app
    # just blinks "urgent" in the workspace pill instead.
    # true so clicking a notification (mako invoke-default-action →
    # xdg-activation) actually focuses the originating app. Apps that
    # abuse activation to steal focus on every event (Telegram) are
    # muzzled per-app in 70-windowrules.conf via suppress_event.
    focus_on_activate       = true
    enable_swallow          = true
    swallow_regex           = ^(kitty|Alacritty|foot)$
}
