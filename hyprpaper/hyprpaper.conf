# hyprpaper — wallpaper daemon.
# Drop a wallpaper at @HOME@/.config/hypr/wallpapers/default.png
# (apply.sh creates a theme gradient there if you don't have one).

preload   = @HOME@/.config/hypr/wallpapers/default.png

# Per-monitor assignment. The empty-name catch-all (`wallpaper = , …`)
# logs "Monitor X has no target" on this build of hyprpaper, so we
# name the outputs explicitly. Update these to match your `hyprctl
# monitors` output when you swap hardware.
wallpaper = DP-3,     @HOME@/.config/hypr/wallpapers/default.png
wallpaper = HDMI-A-1, @HOME@/.config/hypr/wallpapers/default.png

splash = false
ipc    = on
